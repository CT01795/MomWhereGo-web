name: Dropbox Sync

on:
  schedule:
    - cron: '0 7-20/2 * * *'  # 每天 7~20 點，每 2 小時執行一次
  workflow_dispatch:

jobs:
  sync_dropbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master branch with script
        uses: actions/checkout@v3
        with:
          ref: master  # 👈 改回 master 分支，取得 Python 腳本

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install dropbox

      - name: Run Dropbox sync script
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: python .github/scripts/dropbox_sync.py

      - name: Checkout master branch
        run: |
          git fetch origin
          git checkout -B master origin/master || git checkout -B master
          
      - name: Commit and push changes to master
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add dropbox_files/
          git commit -m "Sync Dropbox files to master" || echo "No changes"
          git push origin master
