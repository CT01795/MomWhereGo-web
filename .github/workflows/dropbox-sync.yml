name: Dropbox Sync

on:
  schedule:
    # 每天7-20點每2小時執行一次，可以調整 cron 表達式
    - cron: '0 7-20/2 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  sync_dropbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v3
        with:
          ref: gh-pages   # 👈 這裡改為 gh-pages 分支

      - name: Setup Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install dropbox

      - name: Check for DROPBOX_ACCESS_TOKEN
        run: |
          if [ -z "${DROPBOX_ACCESS_TOKEN}" ]; then
            echo "ERROR: DROPBOX_ACCESS_TOKEN is not set."
            exit 1
          fi
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          
      - name: Sync Dropbox files
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          python .github/scripts/dropbox_sync.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Sync Dropbox files to gh-pages" || echo "No changes to commit"
          git push origin gh-pages   # 👈 這裡改為 gh-pages 分支 