name: Dropbox Sync

on:
  schedule:
    - cron: '0 7-20/2 * * *'  # 每天7~20點，每2小時執行一次
  workflow_dispatch:

jobs:
  sync_dropbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch (get script)
        uses: actions/checkout@v3
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install dropbox

      - name: Sync Dropbox files
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: python .github/scripts/dropbox_sync.py

      - name: Save dropbox_files before switching branch
        run: |
          mv dropbox_files /tmp/dropbox_files

      - name: Checkout gh-pages branch
        run: |
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages || git checkout -b gh-pages

      - name: Copy Dropbox files to gh-pages
        run: |
          rm -rf dropbox_files
          mkdir -p dropbox_files
          cp -r /tmp/dropbox_files/* dropbox_files/

      - name: Commit and push changes to gh-pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add dropbox_files
          git diff-index --quiet HEAD || git commit -m "Sync Dropbox files to gh-pages"
          git push origin gh-pages